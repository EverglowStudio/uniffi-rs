[package]
name = "uniffi_core"
description = "a multi-language bindings generator for rust (runtime support code)"
documentation = "https://mozilla.github.io/uniffi-rs"
homepage = "https://mozilla.github.io/uniffi-rs"
repository = "https://github.com/mozilla/uniffi-rs"
version = "0.32.0"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen"]
readme = "../README.md"

[dependencies]
# Re-exported dependencies used in generated Rust scaffolding files.
anyhow = "1"
async-compat = { version = "0.2.1", optional = true }
async-trait = "0.1"
bytes = "1.11"
futures-core = "0.3"
futures-util = { version = "0.3" }
futures-channel = { version = "0.3", optional = true }
once_cell = "1.10.0"
static_assertions = "1.1.0"
tokio = { version = "1", features = ["sync"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
web-time = { version = "1", optional = true }

[dev-dependencies]
futures = "0.3"

[features]
default = []

# Shared task/time/cancellation APIs; existing FFI polling remains independent.
async-runtime = ["dep:futures-channel", "dep:tokio", "dep:wasm-bindgen-futures", "dep:gloo-timers", "dep:web-time"]

# Printout tracing information on FFI calls.  Useful for debugging issues with the bindings code.
ffi-trace = []

# Enable support for Tokio-backed futures, including stream next() futures.
# Async exports still opt into Tokio through generated scaffolding or the
# `uniffi/default-async-runtime-tokio` convenience feature.
tokio = ["dep:async-compat"]

# Enable support for the ffi buffer scaffolding functions
scaffolding-ffi-buffer-fns = []

# Support for WebAssembly targets in a single-threaded environment.
# This feature is unstable and may change in the future.
wasm-unstable-single-threaded = []

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[[example]]
name = "local_cost"
required-features = ["async-runtime"]

[[example]]
name = "actor_wasm_smoke"
crate-type = ["cdylib"]
required-features = ["async-runtime"]

[[example]]
name = "actor_cost"
required-features = ["async-runtime"]
