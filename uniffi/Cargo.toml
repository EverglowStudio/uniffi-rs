[package]
name = "uniffi"
description = "a multi-language bindings generator for rust"
documentation = "https://mozilla.github.io/uniffi-rs"
homepage = "https://mozilla.github.io/uniffi-rs"
repository = "https://github.com/mozilla/uniffi-rs"
# Incrementing the minor version here means a breaking change to consumers.
#   * See `docs/uniffi-versioning.md` for guidance on when to increment this
#   * Make sure to also update `uniffi_bindgen::UNIFFI_CONTRACT_VERSION"
version = "0.32.0"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen"]
readme = "../README.md"

[dependencies]
uniffi_bindgen = { path = "../uniffi_bindgen", version = "=0.32.0", default-features = false, optional = true }
uniffi_bindgen_javascript = { path = "../uniffi_bindgen_javascript", version = "=0.32.0", default-features = false, optional = true }
uniffi_build = { path = "../uniffi_build", version = "=0.32.0", optional = true }
uniffi_core = { path = "../uniffi_core", version = "=0.32.0" }
uniffi_macros = { path = "../uniffi_macros", version = "=0.32.0" }
uniffi_pipeline = { path = "../uniffi_pipeline", version = "=0.32.0" }
anyhow = "1"
camino = { version = "1.0.8", optional = true }
cargo_metadata = { version = "0.23.1", optional = true }
cargo-config2 = { version = "=0.1.40", optional = true }
# avoid 'clap/color' due to dependency hell.
clap = { version = "4", default-features = false, features = [ "cargo", "derive", "error-context", "help", "suggestions", "std", "usage" ], optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
serde_json = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
toml = { version = "0.9", default-features = false, features = [ "parse", "serde" ], optional = true }
tempfile = { version = "3", optional = true }
libc = { version = "0.2", optional = true }
goblin = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [ "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem" ], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
trybuild = "1"

[features]
default = ["cargo-metadata", "macro-scaffolding"]
# Printout tracing information on FFI calls.  Useful for debugging issues with the bindings code.
ffi-trace = ["uniffi_core/ffi-trace", "uniffi_bindgen?/ffi-trace"]
# Support for features needed by the `build.rs` script. Enable this in your
# `build-dependencies`.
build = [ "dep:uniffi_build" ]
# Support for `uniffi_bindgen::generate_bindings`.
# Enable this feature for your `uniffi-bindgen` binaries if you don't need the full CLI.
bindgen = ["dep:uniffi_bindgen"]
cargo-metadata = ["dep:cargo_metadata", "uniffi_bindgen?/cargo-metadata"]

# Support for `uniffi_bindgen_main()`. Enable this feature for your
# `uniffi-bindgen` binaries. This base CLI intentionally has no JavaScript or
# OHOS packaging dependencies.
cli = [ "bindgen", "dep:clap", "dep:camino" ]
# JavaScript generation/build orchestration. This is a deliberate boundary:
# JavaScript consumers do not pull the OHOS packager dependency graph.
cli-javascript = [
    "cli",
    "cargo-metadata",
    "dep:uniffi_bindgen_javascript",
    "dep:zip",
    "dep:tempfile",
    "dep:libc",
    "dep:windows-sys",
]
# OHOS/Harmony packaging extends the JavaScript CLI with only the native
# package/archive readers it needs.
cli-ohos = [
    "cli-javascript",
    "uniffi_bindgen_javascript/ohos",
    "dep:cargo-config2",
    "dep:serde_json",
    "dep:flate2",
    "dep:tar",
    "dep:toml",
    "dep:goblin",
]
# Support for running example/fixture tests for `uniffi-bindgen`.  You probably
# don't need to enable this.
bindgen-tests = [ "dep:uniffi_bindgen", "uniffi_bindgen?/bindgen-tests" ]
# Enable support for Tokio-backed futures, including stream next() futures.
# Async exports still opt into Tokio through generated scaffolding or the
# `default-async-runtime-tokio` convenience feature.
tokio = ["uniffi_core/tokio"]
# Generate scaffolding in the UniFFI macros
#
# This is a default feature that should always be enabled, except for experimental bindgens like
# uniffi-bindgen-kotlin-jni which generate the necessary scaffolding
macro-scaffolding = ["uniffi_macros/scaffolding"]
# Fork-only convenience feature: on non-wasm targets, plain `#[uniffi::export]`
# on async items defaults to Tokio when `async_runtime` is omitted.
# This also enables the runtime support needed by that generated scaffolding.
default-async-runtime-tokio = ["tokio", "uniffi_macros/default-async-runtime-tokio"]
# Generate extra scaffolding functions that use FfiBuffer to pass arguments and return values
# This is needed for the gecko-js bindings.
scaffolding-ffi-buffer-fns = ["uniffi_core/scaffolding-ffi-buffer-fns", "uniffi_macros/scaffolding-ffi-buffer-fns"]

# Support for WebAssembly targets in a single-threaded environment.
# This feature is unstable and may change in the future.
wasm-unstable-single-threaded = [
    "uniffi_core/wasm-unstable-single-threaded",
    "uniffi_macros/wasm-unstable-single-threaded",
]

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]
doc = false

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"
required-features = ["cli"]
doc = false
