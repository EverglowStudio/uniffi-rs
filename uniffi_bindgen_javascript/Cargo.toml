[package]
name = "uniffi_bindgen_javascript"
version = "0.32.0"
description = "First-class JavaScript/TypeScript bindings generator for uniffi-rs (multi-flavor: wasm + napi, with Electron preload/renderer)"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen", "javascript", "typescript", "wasm", "napi"]

[dependencies]
anyhow = "1"
camino = "1.0.8"
cargo_metadata = "0.23.1"
fs-err = "3.3.0"
heck = "0.5"
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing"] }
toml = "1.1.0"
uniffi_bindgen = { path = "../uniffi_bindgen", version = "=0.32.0" }
uniffi_meta = { path = "../uniffi_meta", version = "=0.32.0" }

[features]
default = []
