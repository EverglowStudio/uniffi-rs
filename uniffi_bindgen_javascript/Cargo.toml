[package]
name = "uniffi_bindgen_javascript"
version = "0.32.0"
description = "First-class JavaScript/TypeScript bindings generator for uniffi-rs (multi-flavor: wasm + napi, with Electron preload/renderer)"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen", "javascript", "typescript", "wasm", "napi"]

[dependencies]
anyhow = "1"
camino = "1.0.8"
cargo_metadata = "0.23.1"
fs-err = "3.3.0"
heck = "0.5"
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing"] }
toml = "1.1.0"
uniffi_bindgen = { path = "../uniffi_bindgen", version = "=0.32.0" }
uniffi_meta = { path = "../uniffi_meta", version = "=0.32.0" }
uniffi_js_abi = { path = "../uniffi_js_abi", version = "=0.32.0" }
uniffi_js_engine_schema = { path = "../uniffi_js_engine_schema", version = "=0.32.0" }
uniffi_js_facade = { path = "../uniffi_js_facade", version = "=0.32.0" }

# The three engine crates are consumed only through their programmatic
# generation APIs.  Keep the revisions in Cargo metadata; generated packages
# never persist engine provenance.
napi_uniffi_engine = { package = "napi-uniffi-engine", git = "https://github.com/EverglowStudio/napi-rs.git", rev = "5ba67e6891722898f2f1e0984ef5d192e0ccd983" }
wasm_bindgen_uniffi_engine = { package = "wasm-bindgen-uniffi-engine", git = "https://github.com/EverglowStudio/wasm-bindgen.git", rev = "192d5272182776f8d5f7c605611414e2b4435701" }
napi_ohos_uniffi_engine = { package = "napi-ohos-uniffi-engine", git = "https://github.com/EverglowStudio/ohos-rs.git", rev = "2a2ae91d91701aadd34734c24769e783bdbdd3c6", optional = true }

[features]
default = ["ohos"]
ohos = ["dep:napi_ohos_uniffi_engine"]
